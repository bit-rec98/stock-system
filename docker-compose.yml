# Local development stack.
#   docker compose up -d db db-init     -> SQL Server only (run the API/frontend on the host)
#   docker compose --profile api up -d  -> also build and run the API container
# Secrets come from the git-ignored .env file (see .env.example).
services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SA_PASSWORD:?Set SA_PASSWORD in .env}
    ports:
      - "127.0.0.1:1433:1433"   # bound to localhost only
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      db:
        condition: service_healthy
    environment:
      SA_PASSWORD: ${SA_PASSWORD}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env}
    volumes:
      - ./db/init.sql:/init.sql:ro
    entrypoint: ["/bin/bash", "-c"]
    command:
      - /opt/mssql-tools18/bin/sqlcmd -C -b -S db -U sa -P "$$SA_PASSWORD" -v APP_PASSWORD="$$APP_DB_PASSWORD" -i /init.sql
    restart: "no"

  api:
    profiles: ["api"]
    build:
      context: ./backend
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      DB_CONNECTION_STRING: Server=db,1433;Database=StockSystemDb;User Id=stock_app;Password=${APP_DB_PASSWORD};TrustServerCertificate=True;MultipleActiveResultSets=true
      JWT_KEY: ${JWT_KEY:?Set JWT_KEY in .env}
      JWT_ISSUER: ${JWT_ISSUER:-StockSystem}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-StockSystemUsers}
      JWT_EXPIRATION_HOURS: ${JWT_EXPIRATION_HOURS:-8}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      SEED_SAMPLE_DATA: ${SEED_SAMPLE_DATA:-false}
      PORT: "8080"
    ports:
      - "127.0.0.1:5000:8080"

volumes:
  sqldata:
